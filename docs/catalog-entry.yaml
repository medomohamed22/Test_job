# Before opening the PR: replace SHA_TO_PIN (3 places) with the full 40-character commit of the final release.
name: hermes-ark
repo: https://github.com/medomohamed22/hermes-ark
sha: SHA_TO_PIN
description: >-
  Encrypted, versioned backups of your whole Hermes — memory, SOUL, skills, config, cron, sessions and
  every profile — with item-level restore. Snapshots happen automatically before every memory/skill write
  and after sessions; a health guard tells the agent (and you) when memory or skills suddenly shrink, with
  the exact /ark restore command that undoes it. Off-site copies to any S3-compatible storage (AWS, R2, B2,
  MinIO) or a folder, new-machine recovery (hermes ark pull), and hermes ark verify to prove every snapshot
  restores. AES-256-GCM, deduplicated, retention pruning; a Hermes Desktop page with timeline, diffs and
  one-click restore. Commands: hermes ark …, /ark …; tool: ark_checkpoint.
  Disclosure — reads the Hermes home and its profiles; writes snapshots only to the configured repository
  folder (default $HERMES_HOME/plugin-data/hermes-ark/repo) and restores into the Hermes home only on an
  explicit user command or Desktop confirmation (the agent has no restore tool); credential stores (.env,
  auth.json, vault, pairing, browser logins, Webapp session token) are never captured unless the user
  enables include_secrets on an encrypted repository; wraps the memory and skill_manage tools with
  tool_execution middleware (snapshot before, compare after; adds a note to the result only when the guard
  fires; never blocks the call); runs one background thread after sessions for periodic snapshots and
  auto-push; network only to the user-configured S3 endpoint (HTTPS; plain http only for localhost);
  reads ARK_PASSPHRASE, ARK_S3_ACCESS_KEY_ID and ARK_S3_SECRET_ACCESS_KEY through the secret scope and
  never stores them; no subprocesses, no telemetry, no self-updater.
maintainer: medomohamed22
tier: community
category: tools
requires_hermes: ">=0.21"
docs_url: https://github.com/medomohamed22/hermes-ark
version: "0.6.1"
image: https://raw.githubusercontent.com/medomohamed22/hermes-ark/SHA_TO_PIN/docs/media/desktop-dark.png
screenshots:
  - https://raw.githubusercontent.com/medomohamed22/hermes-ark/SHA_TO_PIN/docs/media/restore-preview.png
platforms: []
capabilities:
  provides_tools:
  - ark_checkpoint
  provides_hooks:
  - on_session_end
  provides_middleware:
  - tool_execution
  requires_env:
  - ARK_PASSPHRASE
  - ARK_S3_ACCESS_KEY_ID
  - ARK_S3_SECRET_ACCESS_KEY
