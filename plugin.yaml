name: hermes-ark
version: "0.6.2"
description: "Encrypted, versioned backups of your whole Hermes - memory, SOUL, skills, config, cron, sessions and every profile - with item-level restore. Deduplicated snapshots in a repository you control; credentials are never captured unless you opt in and the repository is encrypted."
author: medomohamed22
license: MIT
homepage: https://github.com/medomohamed22/hermes-ark
tags: [backup, restore, snapshots, encryption, memory, skills]
requires_hermes: ">=0.21.6"
python_dependencies: []
provides_tools:
  - ark_checkpoint
provides_hooks:
  - on_session_end
provides_middleware:
  - tool_execution
requires_env:
  - name: ARK_PASSPHRASE
    description: "Passphrase that encrypts the Ark repository (AES-256-GCM, scrypt). Optional for a local unencrypted repository; required to back up credentials."
    secret: true
  - name: ARK_S3_ACCESS_KEY_ID
    description: "Access key for the S3-compatible off-site bucket (only if `remote` is an s3:// URL)."
    secret: true
  - name: ARK_S3_SECRET_ACCESS_KEY
    description: "Secret key for the S3-compatible off-site bucket."
    secret: true
config_schema:
  repository:
    type: str
    default: ""
    label: "Repository location"
    description: "Folder that stores snapshots. Empty = <hermes home>/plugin-data/hermes-ark/repo. Use an external drive or a synced folder to keep backups off this disk."
  include_secrets:
    type: bool
    default: false
    label: "Back up credentials"
    description: "Also capture .env, auth.json and vault files. Refused unless the repository is encrypted."
  exclude:
    type: list
    default: []
    label: "Extra exclusions"
    description: "Paths relative to the Hermes home to leave out, e.g. sessions/large-export."
  auto_snapshots:
    type: bool
    default: true
    label: "Automatic snapshots"
    description: "Checkpoint memory/skills/config before every memory or skill write, and take a full snapshot after sessions every interval."
  interval_minutes:
    type: int
    default: 60
    label: "Full snapshot interval (minutes of activity)"
  health_guard:
    type: bool
    default: true
    label: "Health guard"
    description: "Warn (inside the tool result, so the agent tells you) when memory or skills suddenly shrink or vanish."
  allow_agent_admin:
    type: bool
    default: false
    label: "Let the agent manage Ark"
    description: "Off (recommended): the agent cannot prune, restore, delete or reconfigure Ark, or switch it off — only you can, from your terminal, /ark or Desktop. Protects your backups from prompt injection."
  keep_last:
    type: int
    default: 10
    label: "Keep the last N snapshots"
  keep_hourly:
    type: int
    default: 24
  keep_daily:
    type: int
    default: 7
  keep_weekly:
    type: int
    default: 4
  keep_monthly:
    type: int
    default: 12
  remote:
    type: str
    default: ""
    label: "Off-site copy"
    description: "s3://bucket/prefix (AWS S3, Cloudflare R2, Backblaze B2, MinIO...) or a folder such as a USB drive or NAS. Empty = no off-site copy."
  s3_endpoint:
    type: str
    default: ""
    label: "S3 endpoint"
    description: "e.g. https://<account-id>.r2.cloudflarestorage.com or https://s3.us-east-1.amazonaws.com"
  s3_region:
    type: str
    default: "auto"
    label: "S3 region"
  auto_push:
    type: bool
    default: true
    label: "Push automatically"
    description: "Upload new snapshots to the off-site copy after each automatic snapshot."
  s3_access_key_id:
    type: secret
    env: ARK_S3_ACCESS_KEY_ID
    label: "S3 access key ID"
  s3_secret_access_key:
    type: secret
    env: ARK_S3_SECRET_ACCESS_KEY
    label: "S3 secret access key"
  passphrase:
    type: secret
    env: ARK_PASSPHRASE
    label: "Repository passphrase"
    description: "Encrypts every snapshot. Keep it safe: without it a backup cannot be restored."
